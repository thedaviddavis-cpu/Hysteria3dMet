<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hysteria 3D Flaming Sword Metronome</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), 
                        url('https://thedaviddavis-cpu.github.io/hysteria-metronome/hysteria.png') center/cover fixed;
            font-family: Arial, sans-serif; 
        }
        #info {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            color: white; text-align: center; z-index: 100; pointer-events: none;
        }
        .muse { color: #ff0033; font-size: 3.2em; font-weight: bold; text-shadow: 0 0 30px #ff0033; }
        .hysteria { color: #ffaa00; font-size: 1.6em; margin: 5px 0 10px 0; letter-spacing: 6px; }
        .bpm { color: #00ffcc; font-size: 2.5em; text-shadow: 0 0 25px #00ffcc; }

        button {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            padding: 15px 45px; background: #e60012; color: white; border: none;
            border-radius: 50px; font-size: 19px; font-weight: bold; cursor: pointer; 
            z-index: 100; box-shadow: 0 0 25px rgba(230,0,18,0.8);
        }

        #controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; width: 380px; text-align: center;
        }
        #dio-container {
            position: relative; width: 180px; height: 180px; margin: 0 auto 10px;
        }
        #dio {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 5px solid #ffaa00; box-shadow: 0 0 25px #ff5500;
        }
        #volume-label { color: #ffaa00; font-size: 1.1em; margin-bottom: 5px; }
        input[type="range"] { width: 100%; accent-color: #ff0033; }
    </style>
</head>
<body>
    <div id="info">
        <div class="muse">MUSE</div>
        <div class="hysteria">HYSTERIA</div>
        <div class="bpm">93 BPM</div>
    </div>
    <button id="toggleBtn">START THE RIFF</button>

    <div id="controls">
        <div id="volume-label">VOLUME — DIO APPROVES</div>
        <div id="dio-container">
            <img id="dio" src="dio.jpg" alt="Ronnie James Dio">
        </div>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        let scene, camera, renderer, sword, flames = [], characters = [];
        let isRunning = false;
        let swingAngle = 0;
        let audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let lastClickTime = 0;
        let lastFrameTime = 0;
        let volume = 0.7;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 9, 28);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x442222));
            const light = new THREE.PointLight(0xff5500, 3, 100);
            light.position.set(0, 25, 20);
            scene.add(light);

            const base = new THREE.Mesh(new THREE.BoxGeometry(18, 2, 14), new THREE.MeshPhongMaterial({ color: 0x111111 }));
            base.position.y = 1;
            scene.add(base);

            sword = new THREE.Group();
            const blade = new THREE.Mesh(new THREE.BoxGeometry(1, 22, 0.2), new THREE.MeshPhongMaterial({ color: 0xeeeeee, emissive: 0xff2200, shininess: 100 }));
            blade.position.y = 11;
            sword.add(blade);

            const guard = new THREE.Mesh(new THREE.BoxGeometry(4, 1.2, 1.2), new THREE.MeshPhongMaterial({ color: 0x222222 }));
            guard.position.y = 5.5;
            sword.add(guard);

            const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 7, 16), new THREE.MeshPhongMaterial({ color: 0x111111 }));
            handle.rotation.x = Math.PI / 2;
            handle.position.y = 2;
            sword.add(handle);

            sword.position.set(0, 1, 0);
            scene.add(sword);

            createCharacter(12, 4, -8, 0.6);
            createCharacter(-13, 4, -6, -0.5);

            // Volume control
            const slider = document.getElementById('volumeSlider');
            slider.addEventListener('input', (e) => {
                volume = parseFloat(e.target.value);
            });

            window.addEventListener('resize', onResize);
        }

        function createCharacter(x, y, z, rotation) { /* same as before */ 
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.4, 5, 16), new THREE.MeshPhongMaterial({ color: 0x222222 }));
            body.position.y = 3.5; group.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(1.4, 24, 24), new THREE.MeshPhongMaterial({ color: 0xffddbb }));
            head.position.y = 7.2; group.add(head);
            const hair = new THREE.Mesh(new THREE.SphereGeometry(1.5, 24, 24), new THREE.MeshPhongMaterial({ color: 0x111111 }));
            hair.position.y = 7.6; group.add(hair);
            const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.5, 4, 12), new THREE.MeshPhongMaterial({ color: 0x222222 }));
            armL.position.set(-2.2, 4, 0); armL.rotation.z = 0.8; group.add(armL);
            const armR = armL.clone(); armR.position.x = 2.2; armR.rotation.z = -0.8; group.add(armR);
            group.position.set(x, y, z);
            group.rotation.y = rotation;
            scene.add(group);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function playSnare() {
            const now = Date.now();
            if (now - lastClickTime < 380) return;
            lastClickTime = now;

            const noise = audioContext.createBufferSource();
            const buffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.45, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buffer;

            const filter = audioContext.createBiquadFilter();
            filter.type = 'highpass'; filter.frequency.value = 700;

            const gain = audioContext.createGain();
            gain.gain.setValueAtTime(1.4 * volume, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.38);

            noise.connect(filter).connect(gain).connect(audioContext.destination);
            noise.start();

            const tone = audioContext.createOscillator();
            tone.frequency.setValueAtTime(160, audioContext.currentTime);
            tone.frequency.exponentialRampToValueAtTime(60, audioContext.currentTime + 0.25);
            const toneGain = audioContext.createGain();
            toneGain.gain.setValueAtTime(0.8 * volume, audioContext.currentTime);
            toneGain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.3);
            tone.connect(toneGain).connect(audioContext.destination);
            tone.start();
            tone.stop(audioContext.currentTime + 0.3);

            for (let i = 0; i < 10; i++) createFlame();
        }

        function createFlame() {
            const flame = new THREE.Mesh(
                new THREE.SphereGeometry(0.8 + Math.random() * 0.6, 16, 16),
                new THREE.MeshBasicMaterial({ color: Math.random() > 0.4 ? 0xff5500 : 0xffee00, transparent: true, opacity: 0.95 })
            );
            flame.position.set((Math.random() - 0.5) * 2, 19 + Math.random() * 5, (Math.random() - 0.5) * 1);
            scene.add(flame);
            flames.push(flame);
        }

        function animate(timestamp = 0) {
            requestAnimationFrame(animate);
            const delta = Math.min((timestamp - (lastFrameTime || timestamp)) / 16, 2.8);
            lastFrameTime = timestamp;

            if (isRunning) {
                swingAngle += 0.086 * delta;
                sword.rotation.z = Math.sin(swingAngle) * 0.82;

                if (Math.abs(Math.sin(swingAngle)) > 0.93) {
                    playSnare();
                }
            }

            for (let i = flames.length - 1; i >= 0; i--) {
                const f = flames[i];
                f.position.y += 0.45;
                f.scale.multiplyScalar(0.91);
                f.material.opacity *= 0.86;
                if (f.material.opacity < 0.05) {
                    scene.remove(f);
                    flames.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        // Start/Stop Button
        document.getElementById('toggleBtn').addEventListener('click', () => {
            isRunning = !isRunning;
            const btn = document.getElementById('toggleBtn');
            btn.textContent = isRunning ? "STOP THE RIFF" : "START THE RIFF";
            btn.style.background = isRunning ? "#00cc66" : "#e60012";
        });

        document.addEventListener('keydown', e => {
            if (e.code === 'Space') document.getElementById('toggleBtn').click();
        });
    </script>
</body>
</html>
