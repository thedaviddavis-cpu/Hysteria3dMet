<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hysteria 3D Flaming Sword Metronome</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), 
                        url('https://thedaviddavis-cpu.github.io/hysteria-metronome/hysteria.png') center/cover fixed;
            font-family: Arial, sans-serif; 
        }
        #info {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            color: white; text-align: center; z-index: 100; pointer-events: none;
        }
        .muse { color: #ff0033; font-size: 3.2em; font-weight: bold; text-shadow: 0 0 30px #ff0033; }
        .hysteria { color: #ffaa00; font-size: 1.6em; margin: 5px 0 10px 0; letter-spacing: 6px; }
        .bpm { color: #00ffcc; font-size: 2.5em; text-shadow: 0 0 25px #00ffcc; }
        
        button {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            padding: 15px 45px; background: #e60012; color: white; border: none;
            border-radius: 50px; font-size: 19px; font-weight: bold; cursor: pointer; 
            z-index: 100; box-shadow: 0 0 25px rgba(230,0,18,0.8);
        }
        button:hover { background: #ff1a1a; }
    </style>
</head>
<body>
    <div id="info">
        <div class="muse">MUSE</div>
        <div class="hysteria">HYSTERIA</div>
        <div class="bpm">93 BPM</div>
    </div>
    <button id="toggleBtn">START THE RIFF</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        let scene, camera, renderer, sword, flames = [];
        let isRunning = false;
        let swingAngle = 0;
        let audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let lastClickTime = 0;
        let lastFrameTime = 0;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 25);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x442222));
            const light = new THREE.PointLight(0xff5500, 2.8, 100);
            light.position.set(0, 20, 15);
            scene.add(light);

            // Base
            const base = new THREE.Mesh(
                new THREE.BoxGeometry(14, 2, 12),
                new THREE.MeshPhongMaterial({ color: 0x111111 })
            );
            base.position.y = 1;
            scene.add(base);

            // Sword Group
            sword = new THREE.Group();

            // Long blade
            const blade = new THREE.Mesh(
                new THREE.BoxGeometry(0.9, 20, 0.18),
                new THREE.MeshPhongMaterial({ 
                    color: 0xdddddd, 
                    emissive: 0xff2200,
                    shininess: 120 
                })
            );
            blade.position.y = 10;
            sword.add(blade);

            // Guard
            const guard = new THREE.Mesh(
                new THREE.BoxGeometry(3.5, 1, 1),
                new THREE.MeshPhongMaterial({ color: 0x222222 })
            );
            guard.position.y = 5;
            sword.add(guard);

            // Handle
            const handle = new THREE.Mesh(
                new THREE.CylinderGeometry(0.45, 0.45, 6, 16),
                new THREE.MeshPhongMaterial({ color: 0x111111 })
            );
            handle.rotation.x = Math.PI / 2;
            handle.position.y = 2;
            sword.add(handle);

            sword.position.set(0, 1, 0);
            scene.add(sword);

            // 🔥 Hot rock girl on the side
            const girlTexture = new THREE.TextureLoader().load('https://picsum.photos/id/1011/400/600');
            const girl = new THREE.Mesh(
                new THREE.PlaneGeometry(6, 9),
                new THREE.MeshBasicMaterial({ 
                    map: girlTexture, 
                    side: THREE.DoubleSide 
                })
            );
            girl.position.set(12, 6, -5);
            girl.rotation.y = -0.6;
            scene.add(girl);

            window.addEventListener('resize', onResize);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function playSnare() {
            const now = Date.now();
            if (now - lastClickTime < 400) return;
            lastClickTime = now;

            // Snare drum synthesis
            const noise = audioContext.createBufferSource();
            const noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.4, audioContext.sampleRate);
            const data = noiseBuffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = noiseBuffer;

            const noiseFilter = audioContext.createBiquadFilter();
            noiseFilter.type = 'highpass';
            noiseFilter.frequency.value = 800;

            const noiseGain = audioContext.createGain();
            noiseGain.gain.setValueAtTime(1.2, audioContext.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.35);

            const tone = audioContext.createOscillator();
            tone.type = 'triangle';
            tone.frequency.value = 180;

            const toneGain = audioContext.createGain();
            toneGain.gain.setValueAtTime(0.6, audioContext.currentTime);
            toneGain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.25);

            noise.connect(noiseFilter).connect(noiseGain).connect(audioContext.destination);
            tone.connect(toneGain).connect(audioContext.destination);

            noise.start();
            tone.start();
            tone.stop(audioContext.currentTime + 0.3);

            // Flames on hit
            for (let i = 0; i < 8; i++) createFlame();
        }

        function createFlame() {
            const flame = new THREE.Mesh(
                new THREE.SphereGeometry(0.7 + Math.random(), 16, 16),
                new THREE.MeshBasicMaterial({ 
                    color: Math.random() > 0.5 ? 0xff8800 : 0xffff00,
                    transparent: true,
                    opacity: 0.95
                })
            );
            flame.position.set(
                (Math.random() - 0.5) * 1.5,
                18 + Math.random() * 4,
                (Math.random() - 0.5) * 0.8
            );
            scene.add(flame);
            flames.push(flame);
        }

        function animate(timestamp = 0) {
            requestAnimationFrame(animate);
            const delta = Math.min((timestamp - lastFrameTime) / 16, 2.5);
            lastFrameTime = timestamp;

            if (isRunning) {
                swingAngle += 0.084 * delta;
                sword.rotation.z = Math.sin(swingAngle) * 0.78;

                if (Math.abs(Math.sin(swingAngle)) > 0.925) {
                    playSnare();
                }
            }

            // Update flames
            for (let i = flames.length - 1; i >= 0; i--) {
                const f = flames[i];
                f.position.y += 0.4;
                f.scale.multiplyScalar(0.915);
                f.material.opacity *= 0.87;
                if (f.material.opacity < 0.04) {
                    scene.remove(f);
                    flames.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        document.getElementById('toggleBtn').addEventListener('click', () => {
            isRunning = !isRunning;
            const btn = document.getElementById('toggleBtn');
            btn.textContent = isRunning ? "STOP THE RIFF" : "START THE RIFF";
            btn.style.background = isRunning ? "#00cc66" : "#e60012";
        });

        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                e.preventDefault();
                document.getElementById('toggleBtn').click();
            }
        });
    </script>
</body>
</html>
