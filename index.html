<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hysteria 3D Metronome</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), 
                        url('https://thedaviddavis-cpu.github.io/hysteria-metronome/hysteria.png') center/cover fixed;
            font-family: Arial, sans-serif; 
            touch-action: manipulation;
        }
        #info {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            color: white; text-align: center; z-index: 100; pointer-events: none;
        }
        .muse { color: #ff0033; font-size: 2.6em; font-weight: bold; text-shadow: 0 0 25px #ff0033; }
        .hysteria { color: #ffaa00; font-size: 1.3em; margin: 4px 0 8px 0; letter-spacing: 4px; }
        .bpm { color: #00ffcc; font-size: 2.1em; text-shadow: 0 0 20px #00ffcc; }

        #toggleBtn {
            position: absolute; top: 20px; right: 20px;
            padding: 14px 32px; background: #e60012; color: white; border: none;
            border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; 
            z-index: 200; box-shadow: 0 0 20px rgba(230,0,18,0.9);
            min-width: 160px;
        }
        #toggleBtn:hover, #toggleBtn:active { background: #ff1a1a; }

        #controls {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            z-index: 100; width: 90%; max-width: 380px; text-align: center;
        }
        #dio-container {
            position: relative; width: 140px; height: 140px; margin: 0 auto 10px;
            border-radius: 50%; overflow: hidden; border: 4px solid #ffaa00;
            box-shadow: 0 0 20px #ff5500;
        }
        #dio-low, #dio-high {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; transition: opacity 0.3s ease;
        }
        #volume-label {
            color: #ffaa00; font-size: 1.1em; margin-bottom: 8px; font-weight: bold;
        }
        .slider-container {
            display: flex; align-items: center; gap: 12px; padding: 0 10px;
        }
        input[type="range"] {
            flex: 1; accent-color: #ff0033; height: 8px;
        }
        .slider-labels {
            display: flex; justify-content: space-between; color: #888; font-size: 0.9em; margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="info">
        <div class="muse">MUSE</div>
        <div class="hysteria">HYSTERIA</div>
        <div class="bpm">93 BPM</div>
    </div>
    <button id="toggleBtn">START THE RIFF</button>

    <div id="controls">
        <div id="volume-label">VOLUME — DIO APPROVES</div>
        <div id="dio-container">
            <img id="dio-low" src="./dio-low.jpg" alt="Dio low">
            <img id="dio-high" src="./dio-high.jpg" alt="Dio high">
        </div>
        <div class="slider-container">
            <span style="font-size:1.4em">🔈</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
            <span style="font-size:1.4em">🔊</span>
        </div>
        <div class="slider-labels">
            <span>Quiet</span>
            <span>Loud</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        let scene, camera, renderer, sword, flames = [];
        let isRunning = false;
        let swingAngle = 0;
        let audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let lastClickTime = 0;
        let lastFrameTime = 0;
        let volume = 0.7;
        let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, isMobile ? 11 : 9, isMobile ? 32 : 28);

            renderer = new THREE.WebGLRenderer({ antialias: !isMobile });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x442222));
            const light = new THREE.PointLight(0xff5500, 3, 100);
            light.position.set(0, 25, 20);
            scene.add(light);

            const base = new THREE.Mesh(new THREE.BoxGeometry(18, 2, 14), new THREE.MeshPhongMaterial({ color: 0x111111 }));
            base.position.y = 1;
            scene.add(base);

            sword = new THREE.Group();
            const blade = new THREE.Mesh(new THREE.BoxGeometry(1, 22, 0.2), new THREE.MeshPhongMaterial({ color: 0xeeeeee, emissive: 0xff2200, shininess: 100 }));
            blade.position.y = 11;
            sword.add(blade);

            const guard = new THREE.Mesh(new THREE.BoxGeometry(4, 1.2, 1.2), new THREE.MeshPhongMaterial({ color: 0x222222 }));
            guard.position.y = 5.5;
            sword.add(guard);

            const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 7, 16), new THREE.MeshPhongMaterial({ color: 0x111111 }));
            handle.rotation.x = Math.PI / 2;
            handle.position.y = 2;
            sword.add(handle);

            sword.position.set(0, 1, 0);
            scene.add(sword);

            createCharacter(12, 4, -8, 0.6);
            createCharacter(-13, 4, -6, -0.5);

            window.addEventListener('resize', onResize);
        }

        function createCharacter(x, y, z, rotation) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.4, 5, 12), new THREE.MeshPhongMaterial({ color: 0x222222 }));
            body.position.y = 3.5; group.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(1.4, 20, 20), new THREE.MeshPhongMaterial({ color: 0xffddbb }));
            head.position.y = 7.2; group.add(head);
            const hair = new THREE.Mesh(new THREE.SphereGeometry(1.5, 20, 20), new THREE.MeshPhongMaterial({ color: 0x111111 }));
            hair.position.y = 7.6; group.add(hair);
            group.position.set(x, y, z);
            group.rotation.y = rotation;
            scene.add(group);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateDioEyes() {
            document.getElementById('dio-high').style.opacity = volume;
            document.getElementById('dio-low').style.opacity = 1 - volume;
        }

        function playSnare() {
            if (Date.now() - lastClickTime < 380) return;
            lastClickTime = Date.now();

            const noise = audioContext.createBufferSource();
            const buffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.4, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buffer;

            const filter = audioContext.createBiquadFilter();
            filter.type = 'highpass'; filter.frequency.value = 700;

            const gain = audioContext.createGain();
            gain.gain.setValueAtTime(1.3 * volume, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.35);

            noise.connect(filter).connect(gain).connect(audioContext.destination);
            noise.start();
        }

        function createFlame() {
            const flame = new THREE.Mesh(
                new THREE.SphereGeometry(0.7 + Math.random() * 0.5, 12, 12),
                new THREE.MeshBasicMaterial({ color: Math.random() > 0.4 ? 0xff5500 : 0xffee00, transparent: true, opacity: 0.9 })
            );
            flame.position.set((Math.random() - 0.5) * 2, 19 + Math.random() * 5, (Math.random() - 0.5) * 1);
            scene.add(flame);
            flames.push(flame);
        }

        function animate(timestamp = 0) {
            requestAnimationFrame(animate);
            const delta = Math.min((timestamp - (lastFrameTime || timestamp)) / 16, 2.8);
            lastFrameTime = timestamp;

            if (isRunning) {
                swingAngle += 0.088 * delta;
                sword.rotation.z = Math.sin(swingAngle) * 0.82;

                if (Math.abs(Math.sin(swingAngle)) > 0.93) {
                    playSnare();
                    if (Math.random() > 0.4) createFlame();
                }
            }

            for (let i = flames.length - 1; i >= 0; i--) {
                const f = flames[i];
                f.position.y += 0.45;
                f.scale.multiplyScalar(0.92);
                f.material.opacity *= 0.88;
                if (f.material.opacity < 0.05) {
                    scene.remove(f);
                    flames.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        // Event Listeners
        document.getElementById('toggleBtn').addEventListener('click', () => {
            isRunning = !isRunning;
            const btn = document.getElementById('toggleBtn');
            btn.textContent = isRunning ? "STOP THE RIFF" : "START THE RIFF";
            btn.style.background = isRunning ? "#00cc66" : "#e60012";
        });

        document.getElementById('volumeSlider').addEventListener('input', (e) => {
            volume = parseFloat(e.target.value);
            updateDioEyes();
        });

        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                e.preventDefault();
                document.getElementById('toggleBtn').click();
            }
        });

        // Start
        init();
        animate();
        updateDioEyes();
    </script>
</body>
</html>
