<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hysteria 3D Metronome</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        #info {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            color: white; text-align: center; z-index: 100; pointer-events: none;
        }
        .muse { color: #ff0033; font-size: 3em; font-weight: bold; text-shadow: 0 0 20px #ff0033; }
        .hysteria { color: #ddd; font-size: 1.4em; margin: 5px 0 15px 0; letter-spacing: 3px; }
        .bpm { color: #00ffcc; font-size: 2.4em; text-shadow: 0 0 20px #00ffcc; }
        button {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            padding: 14px 40px; background: #e60012; color: white; border: none;
            border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">
        <div class="muse">MUSE</div>
        <div class="hysteria">HYSTERIA</div>
        <div class="bpm">93 BPM</div>
    </div>
    <button id="toggleBtn">START METRONOME</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script>
        let scene, camera, renderer, pendulum, weight;
        let isRunning = false;
        let swingAngle = 0;
        let audioContext = new (window.AudioContext || window.webkitAudioContext)();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 6, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Lights
            scene.add(new THREE.AmbientLight(0x404040));
            const light = new THREE.PointLight(0xffffff, 1.4, 100);
            light.position.set(10, 25, 20);
            scene.add(light);

            // Base
            const base = new THREE.Mesh(
                new THREE.BoxGeometry(10, 1, 8),
                new THREE.MeshPhongMaterial({ color: 0x1a1a1a })
            );
            base.position.y = 0.5;
            scene.add(base);

            // Pendulum arm
            pendulum = new THREE.Mesh(
                new THREE.BoxGeometry(0.4, 14, 0.4),
                new THREE.MeshPhongMaterial({ color: 0x888888, shininess: 60 })
            );
            pendulum.position.set(0, 8, 0);
            scene.add(pendulum);

            // Weight
            weight = new THREE.Mesh(
                new THREE.SphereGeometry(1.4, 32, 32),
                new THREE.MeshPhongMaterial({ color: 0xff0033, emissive: 0x330000, shininess: 100 })
            );
            weight.position.set(0, 1, 0);
            pendulum.add(weight);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function playClick() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'square';
            osc.frequency.value = 1150;
            gain.gain.value = 0.5;
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.07);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.07);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isRunning) {
                swingAngle += 0.085;
                pendulum.rotation.z = Math.sin(swingAngle) * 0.75;

                if (Math.abs(Math.sin(swingAngle)) > 0.92) {
                    if (!window.lastClick || Date.now() - window.lastClick > 500) {
                        playClick();
                        window.lastClick = Date.now();
                    }
                }
            }

            renderer.render(scene, camera);
        }

        document.getElementById('toggleBtn').addEventListener('click', () => {
            isRunning = !isRunning;
            const btn = document.getElementById('toggleBtn');
            btn.textContent = isRunning ? "STOP METRONOME" : "START METRONOME";
            btn.style.background = isRunning ? "#00cc66" : "#e60012";
        });

        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                e.preventDefault();
                document.getElementById('toggleBtn').click();
            }
        });
    </script>
</body>
</html>
